name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Extract
        run: |
          mkdir project
          unzip -o *.zip -d project

      - name: Fix Java
        run: |
          find project -name build.gradle.kts -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \;

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ngoenkoo-phrae-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
